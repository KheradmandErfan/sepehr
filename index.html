(function theme(){
  const root=document.documentElement,btn=$('#theme'),mq=matchMedia('(prefers-color-scheme: light)');
  const names={auto:'مطابق سیستم',light:'روشن',dark:'تیره'};
  const mode=()=>names[root.dataset.mode]?root.dataset.mode:'auto';
  const resolve=m=>m==='auto'?(mq.matches?'light':'dark'):m;
  const paint=t=>{root.dataset.theme=t;$('meta[name=theme-color]').content=t==='dark'?'#052a2c':'#f3e9cc'};
  function swap(t){
    if(root.dataset.theme===t)return;
    if(document.startViewTransition&&!reduced)document.startViewTransition(()=>paint(t));
    else paint(t);
  }
  function set(m){
    root.dataset.mode=m;
    try{localStorage.setItem('gj-theme',m)}catch{}
    btn.title='پوسته: '+names[m];swap(resolve(m));
  }
  root.dataset.mode=mode();btn.title='پوسته: '+names[mode()];
  btn.onclick=()=>{
    const order=['auto','light','dark'];
    const m=order[(order.indexOf(mode())+1)%3];
    set(m);syncPush();toast('پوسته: '+names[m]);
  };
  mq.addEventListener('change',()=>{if(mode()==='auto')swap(resolve('auto'))});
  window.__theme={set,mode};
})();

/* ---------- poem helpers ---------- */
function toBlocks(verses,plain){
  const out=[];
  if(verses&&verses.length){
    const v=[...verses].sort((a,b)=>a.vOrder-b.vOrder);
    for(let i=0;i<v.length;i++){
      const a=v[i],b=v[i+1];
      if(a.versePosition===0&&b&&b.versePosition===1){out.push({t:'beit',a:a.text,b:b.text,m:a.coupletSummary||b.coupletSummary,v:a,vi:[i,i+1]});i++}
      else if(a.versePosition===2&&b&&b.versePosition===3){out.push({t:'cc',a:a.text,b:b.text,m:a.coupletSummary||b.coupletSummary,v:a,vi:[i,i+1]});i++}
      else out.push({t:(a.text||'').length>90?'p':'c',a:a.text,m:a.coupletSummary,v:a,vi:[i]});
    }
  }else if(plain){
    const l=plain.split(/\r?\n/).filter(Boolean);
    for(let i=0;i<l.length;i+=2)out.push(l[i+1]!=null?{t:'beit',a:l[i],b:l[i+1]}:{t:'c',a:l[i]});
  }
  return out;
}
function renderBlocks(blocks,stagger,opts){
  opts=opts||{};
  const box=h('div',{class:'poem'+(opts.numbers?' nums':'')});
  const mk=b=>{
    if(b.t==='beit')return h('div',{class:'beit'},h('span',{text:b.a}),h('span',{text:b.b}));
    if(b.t==='cc')return h('div',{class:'cc'},h('div',{class:'cline',text:b.a}),h('div',{class:'cline',text:b.b}));
    return h('div',{class:b.t==='p'?'para':'cline',text:b.a});
  };
  blocks.forEach((b,i)=>{
    const cls=stagger?' rise':'';
    const st=stagger?`--i:${i}`:null;
    if(opts.interactive){
      box.append(h('div',{class:'bt'+cls,style:st,'data-i':i},
        h('button',{class:'bn',type:'button','aria-label':'جزئیات بیت '+toFa(i+1),text:toFa(i+1)}),
        h('div',{class:'bv',role:'button',tabindex:'0'},mk(b)),
        h('div',{class:'info'},h('div'))));
    }else{
      const el=mk(b);
      if(stagger){el.classList.add('rise');el.style.setProperty('--i',i)}
      box.append(el);
      if(opts.mean&&b.m)box.append(h('div',{class:'mean',text:b.m}));
    }
  });
  if(opts.interactive){
    const toggle=i=>{
      const w=box.children[i];if(!w)return;
      const was=w.classList.contains('open');
      box.querySelectorAll('.bt.open').forEach(x=>x.classList.remove('open'));
      if(was)return;
      const holder=w.querySelector('.info>div');
      if(!holder.firstChild)holder.append(buildInfo(blocks[i],i,opts.ctx));
      requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
    };
    box.addEventListener('click',e=>{
      const w=e.target.closest('.bt');
      if(!w||e.target.closest('.info'))return;
      toggle(+w.dataset.i);
    });
    box.addEventListener('keydown',e=>{
      if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('bv')){e.preventDefault();toggle(+e.target.closest('.bt').dataset.i)}
    });
  }
  return box;
}

function highlight(text,term){
  const i=norm(text).indexOf(norm(term));
  if(!term||i<0)return text;
  return [text.slice(0,i),h('mark',{text:text.slice(i,i+term.length)}),text.slice(i+term.length)];
}
function snippet(line,term,max=90){
  if(!line||line.length<=max)return line||'';
  const t=fixYK(term);let i=line.indexOf(t);
  if(i<0){const k=norm(line).indexOf(norm(term));i=k<0?0:Math.min(k,line.length-1)}
  let a=Math.max(0,i-Math.floor((max-t.length)/3)),b=Math.min(line.length,a+max);
  if(a>0){const sp=line.indexOf(' ',a);if(sp>-1&&sp<i)a=sp+1}
  if(b<line.length){const sp=line.lastIndexOf(' ',b);if(sp>i+t.length)b=sp}
  return (a>0?'... ':'')+line.slice(a,b).trim()+(b<line.length?' ...':'');
}

const RND={mem:null,busy:false,
  async fetchOne(){
    const n=await LS.countPoems().catch(()=>0);
    if(n>=30||(n>0&&!navigator.onLine)){const lp=await LS.randomPoem();if(lp)return lp}
    try{
      let p=await get('/poem/random',true,true);
      if(!p.verses||!p.verses.length)p=await get('/poem/'+p.id+POEM_Q);
      return p;
    }catch(e){
      if(n>0){const lp=await LS.randomPoem();if(lp)return lp}
      throw e;
    }
  },
  async prefetch(){
    if(this.busy||this.mem)return;
    this.busy=true;
    try{
      const p=await this.fetchOne();
      this.mem=p;
      try{localStorage.setItem('gj-rnd',JSON.stringify(p))}catch{}
    }catch{}
    this.busy=false;
  },
  async take(){
    let p=this.mem;this.mem=null;
    if(!p){
      try{const v=localStorage.getItem('gj-rnd');if(v){localStorage.removeItem('gj-rnd');const o=JSON.parse(v);if(o&&o.id&&(o.verses||o.plainText))p=o}}catch{}
    }else{try{localStorage.removeItem('gj-rnd')}catch{}}
    const quick=!!p;
    if(!p)p=await this.fetchOne();
    setTimeout(()=>this.prefetch(),quick?50:600);
    return p;
  }
};

async function loadHero(box){
  if(!reduced&&box.firstElementChild&&!box.querySelector('.skel')){
    await Promise.all([...box.children].map(c=>c.animate([{opacity:1},{opacity:0,transform:'translateY(-8px)'}],{duration:240,easing:'ease-in',fill:'forwards'}).finished.catch(()=>{})));
  }
  box.replaceChildren(h('div',{class:'skel',style:'height:120px;margin:0 auto;max-width:560px'}));
  try{
    const p=await RND.take();
    const blocks=toBlocks(p.verses,p.plainText).slice(0,2);
    const poet=poetOf(p);
    box.replaceChildren(
      renderBlocks(blocks,true),
      h('div',{class:'hero-meta'},
        h('div',{class:'hero-src rise',style:'--i:3'},h('a',{href:'#/poem/'+p.id,text:(p.title||p.fullTitle)}),' — ',poet),
        h('a',{class:'btn primary rise',style:'--i:4',href:'#/poem/'+p.id,text:'خواندن شعر کامل'}),
        h('button',{class:'btn rise',style:'--i:4',onclick:()=>loadHero(box),text:'شعر دیگر'})
      )
    );
  }catch(e){box.replaceChildren(errorBox(()=>loadHero(box)))}
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}})();
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  for(const f of files){
    const nm=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,c=CRC(data),sz=data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...nm]);
    parts.push(lh,data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...nm]));
    off+=lh.length+sz;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:'application/epub+zip'});
}
const xe=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function collectPoems(catId,cap,out,bookTitle){
  const r=await dfetch(`/cat/${catId}?poems=true&mainSections=false`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json(),c=d.cat||d;
  for(const p of c.poems||[])out.push({id:p.id,title:p.title,sec:c.title});
  if(out.length>cap)return out;
  for(const ch of c.children||[]){await collectPoems(ch.id,cap,out,bookTitle);if(out.length>cap)break}
  return out;
}
async function buildEpub(cat,poetName,onProg){

          chap[k]=`<?xml version="1.0" encoding="UTF-8"?>\n<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="fa" lang="fa" dir="rtl"><head><meta charset="utf-8"/><title>${xe(it.title)}</title><link rel="stylesheet" href="style.css"/></head><body><h2>${xe(it.title)}</h2>\n${body}</body></html>`;

    {name:'OEBPS/style.css',data:'body{direction:rtl;text-align:right;line-height:1.9;margin:1em}h2{text-align:center;font-size:1.2em;margin:1em 0}table.b{width:100%;border-collapse:collapse;margin:.35em 0}table.b td{width:50%;padding:0 .4em;text-align:center}p.c{text-align:center;margin:.35em 0}p.pr{text-align:justify;margin:.5em 0}'},
    {name:'OEBPS/nav.xhtml',data:`<?xml version="1.0" encoding="UTF-8"?>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="fa" dir="rtl"><head><meta charset="utf-8"/><title>فهرست</title></head><body><nav epub:type="toc"><h1>فهرست</h1><ol>${list.map((it,k)=>`<li><a href="c${k}.xhtml">${xe(it.title)}</a></li>`).join('')}</ol></nav></body></html>`},
    {name:'OEBPS/credits.xhtml',data:`<?xml version="1.0" encoding="UTF-8"?>\n<html xmlns="http://www.w3.org/1999/xhtml" lang="fa" dir="rtl"><head><meta charset="utf-8"/><title>درباره</title><link rel="stylesheet" href="style.css"/></head><body><h2>${xe(cat.title)}</h2><p class="c">${xe(poetName)}</p><p class="c">${xe(SITE)} — به کوشش محمد عرفان خردمند</p></body></html>`},
    ...chap.map((x,k)=>({name:`OEBPS/c${k}.xhtml`,data:x})),
    {name:'OEBPS/content.opf',data:`<?xml version="1.0" encoding="UTF-8"?>\n<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid" xml:lang="fa"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="uid">${id}</dc:identifier><dc:title>${xe(cat.title)}</dc:title><dc:creator>${xe(poetName)}</dc:creator><dc:language>fa</dc:language><dc:publisher>${xe(SITE)}</dc:publisher><meta property="dcterms:modified">${new Date().toISOString().replace(/\.\d+Z$/,'Z')}</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="css" href="style.css" media-type="text/css"/><item id="cr" href="credits.xhtml" media-type="application/xhtml+xml"/>${list.map((_,k)=>`<item id="c${k}" href="c${k}.xhtml" media-type="application/xhtml+xml"/>`).join('')}</manifest><spine page-progression-direction="rtl"><itemref idref="cr"/>${list.map((_,k)=>`<itemref idref="c${k}"/>`).join('')}</spine></package>`}

}

function parseSync(xml){

    return [...d.querySelectorAll('OneSync')].map(n=>({o:+(n.querySelector('VerseOrder')||{}).textContent,ms:+(n.querySelector('AudioMiliseconds')||{}).textContent})).filter(x=>!isNaN(x.ms)).sort((a,b)=>a.ms-b.ms);

function wireRecs(ctx,poemEl,recs){
  const blocks=[...poemEl.querySelectorAll('.bt')];
  const audio=ctx.audio=ctx.audio||h('audio',{controls:true,preload:'none'});
  const blockOf=k=>{const b=ctx.blocks||[];return b.findIndex(x=>x.vi&&x.vi.includes(k))};
  ctx.recs=recs.map(o=>{
    let sync=parseSync(pickF(o,['xmlText','syncXml'])||'');
    const n=ctx.nverses;
    if(sync.length===n+1)sync=sync.slice(1);
    return {title:[pickF(o,['audioArtist','artistName']),pickF(o,['audioTitle','title'])].filter(Boolean).join(' — ')||'خوانش',src:pickF(o,['mp3Url','audioSrc']),sync:sync.length===n?sync:[]};
  }).filter(r=>r.src);
  let cur=-1;
  audio.ontimeupdate=()=>{
    const r=ctx.cur;if(!r||!r.sync.length)return;
    const t=audio.currentTime*1000;let k=-1;
    for(let q=0;q<r.sync.length;q++){if(r.sync[q].ms<=t)k=q;else break}
    const bi=k<0?-1:blockOf(k);
    if(bi!==cur){cur=bi;blocks.forEach((el,i)=>el.classList.toggle('playing',i===bi));if(bi>=0&&!audio.paused&&ctx.follow!==false&&blocks[bi])blocks[bi].scrollIntoView({block:'center',behavior:'smooth'})}
  };
  audio.onpause=()=>{if(audio.ended){blocks.forEach(el=>el.classList.remove('playing'));cur=-1}};
  ctx.play=(ri,bi)=>{
    const r=ctx.recs[ri];if(!r)return;
    ctx.cur=r;
    if(audio.getAttribute('src')!==r.src)audio.src=r.src;
    const go=()=>{if(bi!=null&&r.sync.length){const bl=(ctx.blocks[bi]||{}).vi;const e=bl&&r.sync[bl[0]];if(e)audio.currentTime=e.ms/1000}audio.play().catch(()=>{})};
    audio.readyState>=1?go():(audio.addEventListener('loadedmetadata',go,{once:true}),audio.load());
  };
  return ctx.recs;
}

function wordFreqPanel(box,lines){

  const cnt=new Map();
  lines.join(' ').split(/[^\p{L}]+/u).map(w=>norm(w)).filter(w=>w&&w.length>1&&!STOP.has(w)).forEach(w=>cnt.set(w,(cnt.get(w)||0)+1));
  const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fa')).slice(0,40);

}

function notesPanel(box,poemId,getExt){

  async function draw(){
    let list=[];
    let err=null;
    try{list=(await api('/api/notes?poem='+poemId)).notes}catch(e){err=e}
    const plain=x=>{const d=document.createElement('textarea');d.innerHTML=String(x||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]+>/g,'');return d.value.trim()};

      const tx=plain(pickF(o,['htmlComment','text','htmlText','comment','body','commentText']));
      const t=new Date(pickF(o,['publishDate','date','createdAt','t'])||0).getTime()||0;
      return {t,tx,el:()=>h('div',{class:'nt'},h('small',{text:[pickF(o,['authorName','author','userName']),t?new Date(t).toLocaleDateString('fa-IR'):''].filter(Boolean).join(' · ')}),h('p',{text:tx}))};
    }).filter(x=>x.tx);
    if(err&&!ext.length){box.replaceChildren(h('p',{class:'muted',text:err.message}));return}
    const logged=!!ACCT.profile&&!err;
    const ta=h('textarea',{maxlength:1000,placeholder:logged?'حاشیهٔ خود را بنویسید…':'برای نوشتن حاشیه وارد حساب شوید'});
    if(!logged)ta.disabled=true;
    const send=async(parent)=>{
      const text=ta.value.trim();if(!text)return;
      try{const r=await api('/api/notes',{method:'POST',body:{poem:poemId,text,parent:parent||null}});toast(r.message||'حاشیه ثبت شد');ta.value='';draw()}catch(e){toast(e.message)}
    };
    const form=h('div',{class:'ntbox'},ta,logged?h('button',{class:'btn',type:'button',text:'ارسال حاشیه',onclick:()=>send()}):h('a',{href:'#/me',text:'ورود یا ساخت حساب'}));
    const one=n=>{
      const el=h('div',{class:'nt'+(n.parent?' re':'')+(n.id===hl?' hl':''),'data-note':n.id});
      const act=(t,fn,p)=>h('button',{type:'button',text:t,onclick:fn,'aria-pressed':p?'true':'false'});
      const vote=v=>async()=>{if(!logged)return toast('ابتدا وارد شوید');try{await api('/api/notes/'+n.id+'/vote',{method:'POST',body:{v:n.vote===v?0:v}});draw()}catch(e){toast(e.message)}};
      const isSaved=saved().includes(n.id);
      el.append(h('small',{text:n.by+' · '+new Date(n.t).toLocaleDateString('fa-IR')}),h('p',{text:n.text}),
        h('div',{class:'acts'},
          act('پسند '+toFa(n.up),vote(1),n.vote===1),act('ناپسند '+toFa(n.down),vote(-1),n.vote===-1),
          logged?act('پاسخ',()=>{const t=prompt('پاسخ شما:');if(t){ta.value=t;send(n.parent||n.id)}}):'',
          act('رونوشت پیوند',async()=>{try{await navigator.clipboard.writeText(location.origin+location.pathname+'#/poem/'+poemId+'/'+n.id);toast('پیوند حاشیه رونوشت شد')}catch{toast('رونوشت انجام نشد')}}),
          act(isSaved?'ذخیره‌شده':'ذخیره',()=>{const a=saved();const k=a.indexOf(n.id);k>=0?a.splice(k,1):a.push(n.id);try{localStorage.setItem('gj-notes',JSON.stringify(a.slice(-200)))}catch{}draw()},isSaved),
          logged&&!n.mine?act('گزارش',async()=>{if(!confirm('این حاشیه گزارش شود؟'))return;try{await api('/api/notes/'+n.id+'/report',{method:'POST'});toast('گزارش شما ثبت شد')}catch(e){toast(e.message)}}):'',
          n.mine||(ACCT.profile&&ACCT.profile.admin)?act('حذف',async()=>{if(!confirm('حذف شود؟'))return;try{await api('/api/notes/'+n.id+'/delete',{method:'POST'});draw()}catch(e){toast(e.message)}}):''));
      return el;
    };

async function crawlTitles(rootId,t,tok,onHit){
  const queue=[rootId];let seen=0;
  const worker=async()=>{
    while(queue.length&&seen<60&&tok===render.tok){
      const id=queue.shift();seen++;
      let d;try{d=await get(`/cat/${id}?poems=true&mainSections=false`)}catch{continue}
      const c=d.cat||d;
      (c.children||[]).forEach(x=>queue.push(x.id));
      const hs=(c.poems||[]).filter(x=>norm(x.title).includes(t));
      if(hs.length&&tok===render.tok)onHit(hs,c);
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);
  return {truncated:queue.length>0};
}

    });

    let url=`/poems/search?term=${encodeURIComponent(fixYK(term))}&PageNumber=${page}&PageSize=${size}`;
    if(scopePoet)url+='&poetId='+scopePoet.id;

    if(!res.ok)throw new Error('HTTP '+res.status);
    try{const po=JSON.parse(res.headers.get('x-paging-options')||'null');if(po&&po.totalCount!=null)total=po.totalCount}catch{}

        if(FIL.l&&wtok(FIL.l)&&!lastWord(lines[1]||'').endsWith(wtok(FIL.l).slice(0,1)))continue;
        keep.push({r,lines,rank});

        const ok=await Promise.all(keep.map(k=>get('/poem/'+(k.r.id??k.r.poemId)+POEM_Q).then(p=>{const m=(poemMeta(p,p.category&&p.category.cat).find(x=>x[0]==='وزن')||[])[1]||'';return norm(m).includes(norm(FIL.m))}).catch(()=>false)));
        for(let q=keep.length-1;q>=0;q--)if(!ok[q])keep.splice(q,1);
      }

      keep.sort((a,b)=>a.rank-b.rank);
      keep.forEach(({r,lines,rank})=>{
        const id=r.id??r.poemId;

      });
      shownN+=keep.length;
      loaded+=items.length;if(page===1)pop(rows.children);
      if(!shownN&&items.length===size&&page<8){page++;return load()}
      title.textContent=shownN?'شعرهای دارای این عبارت (یکسان یا نزدیک به آن) در متن':`در متن شعرها نتیجهٔ مطابقی برای «${term}» پیدا نشد`;
      if(!shownN)rows.append(h('p',{class:'muted',text:'عبارت دیگری را امتحان کنید یا املای کلمه را بررسی کنید.'}));
      if(items.length===size&&(total==null||loaded<total))more.append(h('button',{class:'btn',text:'نمایش بیشتر',onclick:()=>{page++;load()}}));
    }catch(e){rows.replaceChildren(errorBox(()=>{rows.replaceChildren(skeleton(4));load()}));title.textContent='جستجو در متن انجام نشد'}
  };
  load();
}

const NAVR={'':0,fav:1,fal:2,match:3,abjad:4,me:5};
async function render(){

async function renderRoute(tok){
  if(BK.ov&&BK.close)BK.close(true);
  const parts=decodeURIComponent(location.hash.slice(1)).split('/').filter(Boolean);
  const route=parts[0]||'';
  const idx=route in NAVR?NAVR[route]:0;
  const slide=(route in NAVR)&&idx!==NAV_STATE.last;
  const dir=idx>NAV_STATE.last?1:-1;
  NAV_STATE.last=idx;setDock(idx);
  if(!reduced&&view.firstElementChild&&view.animate){
    const out=view.animate([{opacity:1,transform:'none'},{opacity:0,transform:slide?`translateX(${dir*40}px)`:'translateY(-10px)'}],{duration:210,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
    await out.finished.catch(()=>{});
    out.cancel();
    if(tok!==render.tok)return;
  }
  scrollTo({top:0,behavior:'instant'});
  document.title=route?SITE:SITE+'، '+SLOGAN;
  try{
    if(!route)await homePage(tok);
    else if(route==='cat')await catPage(parts[1],tok);
    else if(route==='poem')await poemPage(parts[1],tok);
    else if(route==='search')await searchPage(parts[1]||'',parts[2]||'0',tok,parts[3]||'');
    else if(route==='fav')favPage();
    else if(route==='fal')falPage();
    else if(route==='match')matchPage(tok);
    else if(route==='abjad')abjadPage();
    else if(route==='map')mapPage(tok);
    else if(route==='semantic')semanticPage(parts[1]||'',tok);
    else if(route==='me')mePage(parts[1]);
    else if(EXTRA[route])await EXTRA[route](parts,tok);
    else await homePage(tok);
  }catch(e){
    if(tok===render.tok)view.replaceChildren(errorBox(render));
  }
  if(tok===render.tok&&!reduced&&view.animate)
    view.animate([{opacity:0,transform:slide?`translateX(${-dir*40}px)`:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'});
}

/* ================= abjad and letters ================= */
const ABJAD={'ا':1,'ب':2,'ج':3,'د':4,'ه':5,'و':6,'ز':7,'ح':8,'ط':9,'ی':10,'ک':20,'ل':30,'م':40,'ن':50,'س':60,'ع':70,'ف':80,'ص':90,'ق':100,'ر':200,'ش':300,'ت':400,'ث':500,'خ':600,'ذ':700,'ض':800,'ظ':900,'غ':1000};
const L1={'آ':'ا','أ':'ا','إ':'ا','ٱ':'ا','ي':'ی','ى':'ی','ئ':'ی','ك':'ک','ة':'ه','ؤ':'و'};
const L2={'پ':'ب','چ':'ج','ژ':'ز','گ':'ک'};
const isLetter=c=>/[\u0621-\u063A\u0641-\u064A\u0671\u067E\u0686\u0698\u06A9\u06AF\u06CC]/.test(c);
const letterOf=c=>isLetter(c)?(L1[c]||c):null;
const abjadVal=c=>{const l=letterOf(c);return l?(ABJAD[L2[l]||l]||0):0};
const abjadSum=t=>[...(t||'')].reduce((n,c)=>n+abjadVal(c),0);
const ABJ_ORDER=[['غ',1000],['ظ',900],['ض',800],['ذ',700],['خ',600],['ث',500],['ت',400],['ش',300],['ر',200],['ق',100],['ص',90],['ف',80],['ع',70],['س',60],['ن',50],['م',40],['ل',30],['ک',20],['ی',10],['ط',9],['ح',8],['ز',7],['و',6],['ه',5],['د',4],['ج',3],['ب',2],['ا',1]];
function numToLetters(n){let s='';for(const [c,v] of ABJ_ORDER){while(n>=v){s+=c;n-=v}}return s}

const WORDS='الله محمد علی حسن حسین فاطمه زهرا مریم عیسی موسی ابراهیم یوسف یعقوب آدم نوح رحمان رحیم کریم عشق دل جان یار دوست مهر نور عقل حق حی قیوم هو سلام صبر شکر امید عدل نام خدا ایران تهران شیراز حافظ سعدی مولوی فردوسی خیام نظامی عطار شعر بهار گل باغ شب روز ماه خورشید آسمان زمین دریا عاشق معشوق جمال کمال جلال لیلی مجنون شیرین فرهاد رستم سهراب رضا مهدی امیر مهران پارسا آرش سیاوش جمشید کاوه داریوش بابک ستاره نسیم باران برف کوه رود سبز سرخ آبی شاد غم درد شادی زندگی مرگ عمر وفا ایمان یقین رحمت برکت نعمت قدرت'.split(' ');
let WORD_IDX=null;
function knownWords(n){
  if(!WORD_IDX){WORD_IDX=new Map();WORDS.forEach(w=>{const v=abjadSum(w);if(!WORD_IDX.has(v))WORD_IDX.set(v,[]);WORD_IDX.get(v).push(w)})}
  return (WORD_IDX.get(n)||[]).slice(0,6);
}
function letterBox(title,text){

  for(const ch of text){const l=letterOf(ch);if(l){letters.push(l);counts.set(l,(counts.get(l)||0)+1)}}
  const order=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fa'));

const beitCache=new Map();
async function beitCountOf(id){
  if(beitCache.has(id))return beitCache.get(id);
  const d=await get(`/poem/${id}?catInfo=false&catPoems=false&rhymes=false&recitations=false&images=false&songs=false&comments=false&verseDetails=false&navigation=false&relatedpoems=false`);
  const n=countBeits(d.verses,d.plainText);beitCache.set(id,n);return n;
}
async function computeBook(ctx){
  const s=ctx.bk;
  if(s.state==='run'||s.state==='done')return;
  const fire=()=>s.subs.forEach(f=>f());
  s.state='run';s.pct=0;fire();
  try{
    if(!ctx.catId){s.state='na';fire();return}
    const d=await get(`/cat/${ctx.catId}?poems=true&mainSections=false`);
    const list=(d.cat||d).poems||[];
    const idx=list.findIndex(x=>String(x.id)===String(ctx.poemId));
    if(idx<0){s.state='na';fire();return}
    if(idx>400){s.state='big';fire();return}
    let sum=0;const before=list.slice(0,idx);
    for(let i=0;i<before.length;i+=8){
      const part=await Promise.all(before.slice(i,i+8).map(x=>beitCountOf(x.id)));
      sum+=part.reduce((a,b)=>a+b,0);
      s.pct=Math.round((i+part.length)/before.length*100);fire();
    }
    s.offset=sum;s.state='done';fire();
  }catch{s.state='na';fire()}
}

const BOOKS={list:[],done:false,p:null,subs:[],n:0,total:0,nt:0};
function booksNotify(now){clearTimeout(BOOKS.nt);const go=()=>BOOKS.subs.slice().forEach(f=>f());now?go():(BOOKS.nt=setTimeout(go,250))}
function booksLoad(){
  if(BOOKS.p)return BOOKS.p;
  BOOKS.p=(async()=>{
    let poets;
    try{poets=await getPoets()}catch{BOOKS.done=true;booksNotify(true);return}
    try{
      const c=JSON.parse(localStorage.getItem('gj-books-v1')||'null');
      if(c&&c.l&&c.l.length&&Date.now()-c.t<6048e5){
        BOOKS.list=c.l.map(([id,title,poet,pid])=>({id,title,poet,pid}));BOOKS.done=true;booksNotify(true);return;
      }
    }catch{}
    const fam=FAMOUS.map(([,k])=>findPoet(poets,k)).filter(Boolean);
    const ids=new Set(fam.map(p=>p.id));
    const queue=[...fam,...poets.filter(p=>!ids.has(p.id))];
    BOOKS.total=queue.length;
    const work=async()=>{
      while(queue.length){
        const p=queue.shift();
        try{
          const d=await get(`/cat/${p.rootCatId}?poems=false&mainSections=false`);
          ((d.cat||d).children||[]).forEach(x=>BOOKS.list.push({id:x.id,title:x.title,poet:p.name,pid:p.id}));
        }catch{}
        BOOKS.n++;booksNotify();
      }
    };
    await Promise.all(Array.from({length:5},work));
    BOOKS.done=true;
    try{localStorage.setItem('gj-books-v1',JSON.stringify({t:Date.now(),l:BOOKS.list.map(b=>[b.id,b.title,b.poet,b.pid])}))}catch{}
    booksNotify(true);
  })();

}

function shortTitle(t,poet){
  const orig=String(t||'').trim();
  let x=orig.replace(/\(.*?\)|\[.*?\]/g,' ').replace(/[«»]/g,'').replace(/\s+/g,' ').trim();
  x=x.replace(/^(دیوان اشعار|دیوان|کلیات اشعار|کلیات|مجموعه اشعار|مجموعه|منتخب اشعار|منتخب|اشعار|آثار)\s+/,'');
  const pw=new Set(norm(poet||'').split(' ').filter(Boolean));
  let ws=x.split(/\s+/).filter(Boolean);
  const rest=ws.filter(w=>!pw.has(norm(w)));
  if(rest.length&&rest.length<ws.length)ws=rest;
  if(!ws.length||(ws.length===1&&pw.has(norm(ws[0]))))ws=orig.replace(/\(.*?\)/g,' ').split(/\s+/).filter(Boolean);
  const STOP=new Set(['و','در','از','به','با','بر']);
  const out=[];let real=0,cut=false;
  for(const w of ws){
    if(!STOP.has(w)){if(real>=2){cut=true;break}real++}
    out.push(w);
  }
  while(out.length&&STOP.has(out[out.length-1])){out.pop();cut=true}
  let r=out.join(' ');
  if(r.length>16){r=r.slice(0,15).trim();cut=true}
  return (r||orig)+(cut?'…':'');
}

function renderShelfSection(box){
  const shelf=h('div',{class:'shelf',tabindex:'0','aria-label':'قفسهٔ کتاب‌ها'});
  const sentinel=h('span',{class:'sentinel','aria-hidden':'true'});
  const note=h('p',{class:'note',style:'text-align:center;margin-top:10px'});
  box.append(h('div',{class:'cab'},h('div',{class:'cab-top'},h('div',{class:'cab-plate',text:'قفسهٔ کتاب‌ها'})),h('div',{class:'cab-body'},shelf,h('div',{class:'plank'})),h('div',{class:'cab-base'})),note);
  for(let i=0;i<8;i++)shelf.append(h('span',{class:'spine sk',style:'--sh:'+(214+(i*17)%34)+'px'}));
  let shown=0,started=false,chk=0;
  const near=()=>{
    const a=sentinel.getBoundingClientRect(),b=shelf.getBoundingClientRect();

  };

  };
  const sub=()=>{
    if(!document.body.contains(shelf)){BOOKS.subs=BOOKS.subs.filter(f=>f!==sub);return}
    if(!started||near())more();
    note.textContent=BOOKS.done?'':`در حال بارگذاری فهرست کتاب‌ها… ${toFa(BOOKS.n)} از ${toFa(BOOKS.total||0)} شاعر`;
  };
  shelf.addEventListener('scroll',()=>{if(chk)return;chk=requestAnimationFrame(()=>{chk=0;if(started&&shown<BOOKS.list.length&&near())more()})},{passive:true});
  BOOKS.subs.push(sub);booksLoad();sub();
}

function abjadView(){
  let mode='t2a';
  const ta=h('textarea',{class:'ta',rows:'3',dir:'auto','aria-label':'ورودی',placeholder:'متن را بنویسید…'});
  const out=h('div');
  const b1=h('button',{type:'button',class:'on',text:'متن ← ابجد'}),b2=h('button',{type:'button',text:'ابجد ← متن'});
  const setMode=m=>{
    mode=m;b1.classList.toggle('on',m==='t2a');b2.classList.toggle('on',m==='a2t');
    ta.placeholder=m==='t2a'?'متن را بنویسید…':'یک یا چند عدد بنویسید؛ مثلاً ۷۸۶ یا ۱۳۱۳';
    calc();
  };
  b1.onclick=()=>setMode('t2a');b2.onclick=()=>setMode('a2t');

    if(mode==='t2a'){
      const ws=ta.value.split(/\s+/).filter(Boolean).map(w=>[w,abjadSum(w)]).filter(x=>x[1]>0);
      if(!ws.length){out.replaceChildren();return}
      const total=ws.reduce((a,x)=>a+x[1],0);

        h('div',{class:'achips'},ws.map(([w,v])=>h('span',{class:'chip',text:`${w}: ${toFa(v)}`}))));
    }else{
      const nums=(ta.value.match(/[\d۰-۹٠-٩]+/g)||[]).map(x=>+norm(x)).filter(n=>n>0&&n<=100000);
      if(!nums.length){out.replaceChildren();return}
      const ls=nums.map(numToLetters);
      const known=nums.map(n=>knownWords(n));
      const head=nums.map((n,i)=>known[i][0]||ls[i]).join(' ');
      out.replaceChildren(
        h('div',{class:'abig'},h('small',{text:'متن ابجدی'}),h('b',{style:'font-size:1.7rem;overflow-wrap:break-word',text:head})),
        ...nums.map((n,i)=>h('div',{class:'abrow'},h('small',{text:toFa(n)}),
          h('div',{class:'achips'},[...known[i],ls[i]].filter((w,k,a)=>a.indexOf(w)===k).map(w=>h('span',{class:'chip',text:w}))))),
        h('p',{class:'note',style:'margin-top:10px',text:'هر عدد را می‌شود با چند ترکیب از حروف ابجد خواند. اول واژه‌های آشنای هم‌ارز و در پایان کوتاه‌ترین ترکیب حروف نشان داده می‌شود.'}));
    }

  return h('div',{},h('div',{class:'seg'},b1,b2),ta,out);
}

async function simiPage(){
  document.title='مشابه‌یابی | '+SITE;
  const ta=h('textarea',{class:'inp',rows:4,placeholder:'یک بیت یا چند مصراع را بنویسید یا بچسبانید…','aria-label':'متن برای مشابه‌یابی',style:'width:100%;box-sizing:border-box'});
  const out=h('div',{class:'rows',style:'margin-top:14px'}),st=h('small',{class:'muted'});
  const toks=t=>wtok(t).split(' ').filter(Boolean);
  const jac=(A,B)=>{const a=new Set(A),b=new Set(B);let i=0;a.forEach(x=>{if(b.has(x))i++});const u=new Set([...a,...b]).size;return u?i/u:0};
  const run=async()=>{
    const ws=toks(ta.value);
    if(ws.length<3)return toast('دست‌کم سه واژه بنویسید');
    btn.disabled=true;st.textContent=' در حال جستجو…';out.replaceChildren(skeleton(3));
    try{
      const k=Math.min(4,ws.length),starts=[...new Set([0,Math.floor((ws.length-k)/2),ws.length-k])];
      const pages=await Promise.all(starts.map(s=>dfetch(`/poems/search?term=${encodeURIComponent(ws.slice(s,s+k).join(' '))}&PageNumber=1&PageSize=12`).then(r=>r.ok?r.json():[]).catch(()=>[])));
      const seen=new Map();
      pages.flat().forEach(r=>{const id=r.id??r.poemId;if(id!=null&&!seen.has(id))seen.set(id,r)});
      const res=[];
      seen.forEach((r,id)=>{
        const lines=String(r.plainText||r.excerpt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
        let best=0,bl='';
        for(let i=0;i<lines.length;i++)for(const span of [1,2]){const seg=lines.slice(i,i+span).join(' '),s=jac(ws,toks(seg));if(s>best){best=s;bl=seg}}
        if(best>=.25)res.push({id,r,best,bl});
      });
      res.sort((a,b)=>b.best-a.best);
      st.textContent='';
      out.replaceChildren(...(res.length?res.slice(0,12).map(x=>h('a',{class:'row glass',href:'#/poem/'+x.id},
        h('b',{text:x.r.fullTitle||x.r.title||'شعر'}),h('small',{class:'muted',text:' — شباهت '+toFa(Math.round(x.best*100))+'٪'}),h('p',{text:x.bl}))):[h('p',{class:'muted',text:'شعر مشابهی پیدا نشد. املای واژه‌ها را بسنجید یا عبارت دیگری را امتحان کنید.'})]));
      if(res.length)pop(out.children);
    }catch(e){st.textContent='';out.replaceChildren(errorBox(run))}
    btn.disabled=false;
  };
  const btn=h('button',{class:'btn primary',type:'button',text:'یافتن شعرهای مشابه',onclick:run});
  view.replaceChildren(crumbs([{text:SITE,href:'#/'},{text:'مشابه‌یابی'}]),h('h1',{text:'مشابه‌یابی',style:'margin-bottom:14px'}),
    h('section',{class:'secbox glass'},h('p',{class:'note',text:'متنی بنویسید تا شعرهای نزدیک به آن پیدا شود.'}),ta,h('p',{style:'margin:10px 0 0'},btn,st),out));
}

      h('section',{class:'secbox glass'},h('h2',{text:'روی این دستگاه'}),

  }catch(e){if(tok===render.tok)view.replaceChildren(errorBox(()=>render()))}

/* نمایش روان و پلکانی آیتم‌ها هنگام رسیدن به صفحه */
(function reveal(){
  if(reduced||!('IntersectionObserver' in window)||!window.MutationObserver)return;
  const SEL='.rows>*,.grid>*,.phgrid>*,.fam-grid>*,.cent-row>*,.chips>*,.poem .bt,.secpanel>*,.sbarrow';
  const io=new IntersectionObserver(es=>{
    let k=0;
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      const el=e.target;io.unobserve(el);
      el.style.transitionDelay=Math.min(k++*45,360)+'ms';
      requestAnimationFrame(()=>el.classList.add('in'));
      const done=()=>{el.classList.remove('rv','in');el.style.transitionDelay=''};
      el.addEventListener('transitionend',done,{once:true});setTimeout(done,1500);
    });
  },{rootMargin:'0px 0px -5% 0px',threshold:.05});
  const prep=n=>{
    if(n.nodeType!==1)return;
    const list=n.matches(SEL)?[n]:[];
    n.querySelectorAll(SEL).forEach(x=>list.push(x));
    list.forEach(el=>{if(el.dataset.rv||(el.style.animation||'').length)return;el.dataset.rv='1';el.classList.add('rv');io.observe(el)});
  };
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(prep))).observe($('#view'),{childList:true,subtree:true});
})();
(function(){let last='';const go=e=>{const a=e.target.closest&&e.target.closest('a[href^="#/poem/"]');if(!a)return;const id=(a.getAttribute('href').split('/')[2]||'').replace(/\D.*/,'');if(!id||id===last)return;last=id;get('/poem/'+id+POEM_Q,false,true).catch(()=>{})};document.addEventListener('pointerover',go,{passive:true});document.addEventListener('touchstart',go,{passive:true})})();

setTimeout(()=>{if((DL.isOn()&&(DL.standalone()||DL.armed()))||(DL.wantAll()&&DL.armed()))DL.start(false,DL.wantAll())},4000);
